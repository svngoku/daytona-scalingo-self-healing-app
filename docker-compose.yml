services:
  broken-app:
    build: ./apps/broken-app
    environment:
      LOG_PATH: /data/broken-app.jsonl
      PORT: "8001"
    volumes: ["run-data:/data"]
    ports: ["127.0.0.1:8001:8001"]
  orchestrator:
    build:
      context: .
      dockerfile: apps/orchestrator/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      BROKEN_APP_URL: http://broken-app:8001
      LOCAL_LOGS_PATH: /data/broken-app.jsonl
      DATABASE_URL: sqlite:////data/incidents.db
      REPO_ROOT: /workspace
    volumes:
      - run-data:/data
      # Local development controller only. The repair containers NEVER mount this socket.
      - /var/run/docker.sock:/var/run/docker.sock
    ports: ["127.0.0.1:8000:8000"]
    depends_on: [broken-app]
  dashboard:
    image: node:22-bookworm-slim
    working_dir: /workspace/apps/dashboard
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"
    environment:
      ORCHESTRATOR_API_URL: http://orchestrator:8000
    volumes:
      - ./apps/dashboard:/workspace/apps/dashboard
      - ./packages:/workspace/packages:ro
      - dashboard-modules:/workspace/apps/dashboard/node_modules
      - dashboard-next:/workspace/apps/dashboard/.next
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [orchestrator]
volumes:
  run-data:
  dashboard-modules:
  dashboard-next:
