[project]
name = "self-healing-demo"
version = "0.1.0"
description = "An evidence-driven repair workflow orchestrating Daytona, Scalingo, GitHub and OpenRouter"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.163.1", "uvicorn==0.54.0", "httpx[socks]==0.28.1",
  "pydantic-settings==2.16.3", "openai==3.52.0",
]

[project.optional-dependencies]
daytona = ["daytona==0.231.1"]
dev = ["pytest==9.2.0", "pytest-asyncio==1.5.0", "ruff==0.17.5"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/orchestrator/healing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/orchestrator"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["docker: opt-in real local isolated execution", "live: opt-in credentialed provider checks"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
